services:
  - type: web
    name: hci-experiment-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.5"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hci-db
          property: connectionString

databases:
  - name: hci-db
    plan: free
    databaseName: hci_experiment
    user: hci_user
