services:
  - type: web
    name: hci-experiment-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hci-db
          property: connectionString

databases:
  - name: hci-db
    plan: free
    databaseName: hci_experiment
    user: hci_user

